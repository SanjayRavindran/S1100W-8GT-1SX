name: RTLPlayground Weekly Firmware Builder

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'tools/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'tools/**'
  schedule:
    # Weekly build on upstream main (Sundays at 02:00 UTC)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'RTLPlayground branch, tag, or commit SHA (default: main)'
        required: false
        default: 'main'
      publish_release:
        description: 'Publish GitHub Release with compiled binaries and generated release notes'
        required: false
        type: boolean
        default: false
      force_build:
        description: 'Rebuild even if a release for the resolved tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rtlplayground-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check Upstream Main
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.upstream.outputs.should_build }}
      target_ref: ${{ steps.upstream.outputs.target_ref }}
      commit_sha: ${{ steps.upstream.outputs.commit_sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      fw_version: ${{ steps.upstream.outputs.fw_version }}
      release_tag: ${{ steps.upstream.outputs.release_tag }}
      publish_release: ${{ steps.upstream.outputs.publish_release }}
      force_build: ${{ steps.upstream.outputs.force_build }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Upstream RTLPlayground Main & Compatibility
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_upstream_release.py \
            --event "${{ github.event_name }}" \
            --target-ref "${{ github.event.inputs.target_ref }}" \
            --publish-release "${{ github.event.inputs.publish_release }}" \
            --force-build "${{ github.event.inputs.force_build }}" \
            --repo "${{ github.repository }}"

  build:
    name: Build & Verify Firmware
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build & Packaging Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            curl \
            make \
            gcc \
            g++ \
            binutils \
            bison \
            flex \
            libboost-dev \
            libboost-graph-dev \
            patch \
            bzip2 \
            xz-utils \
            zstd \
            xxd \
            python3 \
            python-is-python3 \
            libjson-c-dev \
            zlib1g-dev \
            pkg-config \
            jq
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory '*'

      - name: Clone Upstream RTLPlayground
        run: |
          TARGET_REF="${{ needs.check.outputs.target_ref }}"
          PINNED_SHA="${{ needs.check.outputs.commit_sha }}"
          echo "Cloning logicog/RTLPlayground (ref: ${TARGET_REF}, pinned commit: ${PINNED_SHA})"
          git clone --filter=blob:none https://github.com/logicog/RTLPlayground.git RTLPlayground
          git -C RTLPlayground checkout --detach "${PINNED_SHA}"

          cd RTLPlayground
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "${ACTUAL_SHA}" != "${PINNED_SHA}" ]; then
            echo "Commit mismatch: expected ${PINNED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi

          COMMIT_HASH="${{ needs.check.outputs.short_sha }}"
          FW_VERSION="${{ needs.check.outputs.fw_version }}"
          RELEASE_TAG="${{ needs.check.outputs.release_tag }}"

          echo "COMMIT_FULL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "COMMIT_HASH=${COMMIT_HASH}" >> "$GITHUB_ENV"
          echo "FW_VERSION=${FW_VERSION}" >> "$GITHUB_ENV"
          echo "EFFECTIVE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "Upstream ref: ${TARGET_REF} | Commit: ${COMMIT_HASH} (${ACTUAL_SHA}) | Makefile VERSION: ${FW_VERSION} | Effective tag: ${RELEASE_TAG}"

      - name: Verify Target Release Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SKIP_PUBLISH="false"
          if [ "${{ needs.check.outputs.publish_release }}" = "true" ] && [ "${{ needs.check.outputs.force_build }}" != "true" ]; then
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${EFFECTIVE_TAG}")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Release ${EFFECTIVE_TAG} already exists; skipping release publication."
              SKIP_PUBLISH="true"
            fi
          fi
          echo "SKIP_PUBLISH=${SKIP_PUBLISH}" >> "$GITHUB_ENV"

      - name: Cache Patched SDCC Toolchain
        uses: actions/cache@v4
        with:
          path: RTLPlayground/toolchain
          key: sdcc-trixie-${{ hashFiles('RTLPlayground/sdcc/*') }}

      - name: Ensure Patched SDCC Toolchain
        run: |
          cd RTLPlayground
          SDCC_DIR="toolchain/sdcc-$(cat sdcc/* | cksum | cut -d' ' -f1)"
          if [ ! -x "${SDCC_DIR}/bin/sdcc" ]; then
            echo "Building patched SDCC toolchain at ${SDCC_DIR}..."
            for attempt in 1 2 3; do
              if sh sdcc/build.sh "$(pwd)/${SDCC_DIR}"; then
                break
              fi
              echo "SDCC build attempt ${attempt} failed; cleaning up before retry..."
              rm -rf "${SDCC_DIR}"
              if [ "${attempt}" -eq 3 ]; then
                echo "SDCC toolchain build failed after 3 attempts."
                exit 1
              fi
              sleep 10
            done
          else
            echo "Restored cached SDCC toolchain at ${SDCC_DIR}"
          fi
          SDCC_VERSION=$("${SDCC_DIR}/bin/sdcc" --version | head -n1)
          echo "SDCC_VERSION=${SDCC_VERSION}" >> "$GITHUB_ENV"
          echo "${SDCC_VERSION}"

      - name: Configure S1100W Board Profile
        run: cp config/s1100w.txt RTLPlayground/config_s1100w.txt

      - name: Compile S1100W Firmware & OEM Installer
        run: |
          cd RTLPlayground
          make CI=1 MACHINE=HASIVO_S1100WP_8GT_1SX_SE CONFIG=config_s1100w.txt
          make -C installer

      - name: Package & Verify Checksums
        run: |
          mkdir -p dist
          OEM_BIN="dist/S1100W-OPENSOURCE-${EFFECTIVE_TAG}-OEM-UPGRADE.bin"
          FULL_BIN="dist/S1100W-OPENSOURCE-${EFFECTIVE_TAG}-FULL-FLASH.bin"

          cp -L RTLPlayground/installer/output/rtlplayground_oem_upgrade.bin "${OEM_BIN}"
          cp -L RTLPlayground/output/rtlplayground.bin "${FULL_BIN}"
          chmod 0644 "${OEM_BIN}" "${FULL_BIN}"

          echo "=== Realtek Container Checksum Verification (OEM Upgrade) ==="
          python3 tools/calcsum.py "${OEM_BIN}"

          echo "=== CRC-16 Verification (Full 512KB Flash Image) ==="
          ./RTLPlayground/tools/output/HASIVO_S1100WP_8GT_1SX_SE/crc_calculator -v "${FULL_BIN}"

          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

          echo "OEM_BIN=${OEM_BIN}" >> "$GITHUB_ENV"
          echo "FULL_BIN=${FULL_BIN}" >> "$GITHUB_ENV"

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --upstream "logicog/RTLPlayground" \
            --upstream-dir "RTLPlayground" \
            --target-ref "${{ needs.check.outputs.target_ref }}" \
            --commit-sha "${COMMIT_FULL_SHA}" \
            --fw-version "${FW_VERSION}" \
            --release-tag "${EFFECTIVE_TAG}" \
            --trigger-event "${{ github.event_name }}" \
            --oem-bin "${OEM_BIN}" \
            --full-bin "${FULL_BIN}" \
            --sha256sums "dist/SHA256SUMS.txt" \
            --mem-file "RTLPlayground/output/HASIVO_S1100WP_8GT_1SX_SE/rtlplayground.mem" \
            --sdcc-version "${SDCC_VERSION}" \
            --output "release_notes.md"
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S1100W-OPENSOURCE-${{ env.EFFECTIVE_TAG }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: needs.check.outputs.publish_release == 'true' && env.SKIP_PUBLISH != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          name: S1100W-8GT-1SX Open-Source Firmware (${{ env.EFFECTIVE_TAG }})
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
